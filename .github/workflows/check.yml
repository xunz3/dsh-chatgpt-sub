name: Check
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - if: matrix.node == 26
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.node == 26
        run: pnpm test:browser
      - run: pnpm check:package
        id: package
      - if: matrix.node == 26
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: printf 'tarball=%s\nintegrity=%s\n' "$TARBALL" "$INTEGRITY" > release-package.txt
      - if: matrix.node == 26
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            ${{ steps.package.outputs.tarball }}
            release-package.txt
          retention-days: 7
          if-no-files-found: error
